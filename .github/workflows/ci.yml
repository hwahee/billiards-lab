name: CI

# Runs on every push (and PRs from forks) — see the DX section of the README.
on:
  push:
  pull_request:

jobs:
  ci:
    # Pinned here only (the boilerplate uses ubuntu-latest): the physics
    # golden fixture (src/shared/billiards/__fixtures__/golden-steps.json)
    # replays bit-exactly, and the engine's Math.sin/Math.cos go through the
    # system glibc libm. ubuntu-26.04's newer glibc moves their last bit, so
    # the fixture only replays on the image it was recorded against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Both versions come from package.json — setup-bun reads `packageManager`
      # (falling back to `engines.bun`), setup-node reads `engines.node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (format check)
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript (strict typecheck)
        run: bun run typecheck

      - name: Knip (unused files/exports/dependencies)
        run: bun run knip

      - name: Tests (unit + API integration, in-memory DB)
        run: bun test

      - name: Production build
        run: bun run build
